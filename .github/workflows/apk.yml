name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build the web app
        run: python3 build.py
      - name: Fetch the signing key
        env:
          KEY_B64: ${{ secrets.DAYLINE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > android/dayline.jks; fi
          test -s android/dayline.jks || { echo "No signing key found" | tee build.log; exit 1; }
      - name: Build the APK
        env:
          DAYLINE_KEY_PASS: ${{ secrets.DAYLINE_KEY_PASS }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --console=plain 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk dayline.apk
      # Arch Linux package, made and tried out inside an Arch container. If this step breaks, the Android and web
      # builds are still published; arch.log and linux-test.txt say what happened.
      - name: Build and test the Arch Linux package
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" archlinux:latest bash /work/linux/ci-arch.sh > arch.log 2>&1 || echo "failed with $?" >> arch.log
          tail -60 arch.log
      # The app reads latest.json to see whether a newer build exists and to check its download.
      - name: Describe the build
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          jq -n --argjson build "${{ github.run_number }}" --arg version "1.0" \
            --arg sha "$(sha256sum dayline.apk | cut -d' ' -f1)" --arg web "$(sha256sum dayline-web.tar.gz | cut -d' ' -f1)" \
            --arg notes "$(printf '%s' "$NOTES" | head -1)" \
            '{build:$build, version:$version, sha256:$sha, web_sha256:$web, notes:$notes}' > latest.json
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            dayline.apk
            latest.json
            dayline-web.tar.gz
            dayline-linux.tar.gz
            dayline-any.pkg.tar.zst
            linux-test.txt
            arch.log
      # The same page, installable from a browser on Windows and Linux (served by GitHub Pages from the gh-pages branch).
      - name: Publish the web version
        run: |
          cd dist && touch .nojekyll && git init -q -b gh-pages
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
      - name: Keep the log when a build fails
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          cd /tmp/log && git init -q -b ci-log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${{ github.run_number }} log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log
