name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build the web app
        run: python3 build.py
      - name: Fetch the signing key
        env:
          KEY_B64: ${{ secrets.DAYLINE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > android/dayline.jks; fi
          test -s android/dayline.jks || { echo "No signing key found" | tee build.log; exit 1; }
      - name: Build the APK
        env:
          DAYLINE_KEY_PASS: ${{ secrets.DAYLINE_KEY_PASS }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --console=plain 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk dayline.apk
      # Arch Linux package, made and tried out inside an Arch container. If this step breaks, the Android and web
      # builds are still published; arch.log and linux-test.txt say what happened.
      - name: Build and test the Arch Linux package
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" archlinux:latest bash /work/linux/ci-arch.sh > arch.log 2>&1 || echo "failed with $?" >> arch.log
          tail -60 arch.log
      # The app reads latest.json to see whether a newer build exists and to check its download.
      - name: Describe the build
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          jq -n --argjson build "${{ github.run_number }}" --arg version "1.0" \
            --arg sha "$(sha256sum dayline.apk | cut -d' ' -f1)" --arg web "$(sha256sum dayline-web.tar.gz | cut -d' ' -f1)" \
            --arg notes "$(printf '%s' "$NOTES" | head -1)" \
            '{build:$build, version:$version, sha256:$sha, web_sha256:$web, notes:$notes}' > latest.json
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            dayline.apk
            latest.json
            dayline-web.tar.gz
            dayline-linux.tar.gz
            dayline-any.pkg.tar.zst
            linux-test.txt
            arch.log
      # The same page, installable from a browser on Windows and Linux (served by GitHub Pages from the gh-pages branch).
      - name: Publish the web version
        run: |
          cd dist && touch .nojekyll && git init -q -b gh-pages
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
      - name: Keep the log when a build fails
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          cd /tmp/log && git init -q -b ci-log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${{ github.run_number }} log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log

  # Windows app: the same pages in a native window (WebView2). Built, started twice as a check, then packed as an
  # installer and a portable zip and added to the release the job above made.
  windows:
    needs: apk
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web app
        run: python build.py
      - name: Build the Windows app
        shell: pwsh
        run: |
          dotnet build windows/Dayline.csproj -c Release -o app --nologo 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item dist app\web -Recurse
          Remove-Item app\Microsoft.Web.WebView2.Wpf.*, app\*.pdb, app\*.xml -ErrorAction SilentlyContinue
          Get-ChildItem app -Recurse -File | ForEach-Object { "{0,9}  {1}" -f $_.Length, $_.FullName.Substring("$PWD\app\".Length) } | Tee-Object windows-build.log -Append
      - name: Try it out
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($run in 1, 2) {
            Remove-Item selftest.txt -ErrorAction SilentlyContinue
            $p = Start-Process app\Dayline.exe -ArgumentList '--self-test', "$PWD\selftest.txt" -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); "run ${run}: no answer after two minutes" >> windows-test.txt }
            elseif (Test-Path selftest.txt) { "run ${run}: $(Get-Content selftest.txt -Raw)" >> windows-test.txt }
            else { "run ${run}: no result, exit code $($p.ExitCode)" >> windows-test.txt }
          }
          Get-Content windows-test.txt
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive app\* dayline-windows.zip
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBuild=$env:GITHUB_RUN_NUMBER" "/DAppDir=$PWD\app" "/DOutDir=$PWD" windows\dayline.iss 2>&1 | Select-Object -Last 8 | Tee-Object windows-build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dayline-setup.exe, dayline-windows.zip | ForEach-Object { "{0,9}  {1}" -f $_.Length, $_.Name } | Tee-Object windows-build.log -Append
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            dayline-setup.exe
            dayline-windows.zip
            windows-test.txt
            windows-build.log

